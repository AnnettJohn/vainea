<title>VAINEA States</title>
<meta name="description" content="WEAR YOUR STATE OF MIND — the VAINEA D2C homepage: four color-coded moods, a shoppable resort wardrobe, and a working cart." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --vanilla:#F3EBDD;
    --soft-white:#FBFAF7;
    --ink:#252525;
    --sun:#FF5B2E;
    --sea:#0780D5;
    --dream:#CEC8F4;
    --light:#DFFF35;
    --ink-70: rgba(37,37,37,.72);
    --ink-50: rgba(37,37,37,.52);
    --ink-30: rgba(37,37,37,.30);
    --line: rgba(37,37,37,.14);
    --radius: 10px;
    --maxw: 1440px;
    --gutter: clamp(20px, 4vw, 64px);
    --gap-xl: clamp(70px, 10vw, 180px);
    --gap-lg: clamp(48px, 6vw, 96px);
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    --header-h: 76px;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--soft-white);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-top:var(--header-h);
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;color:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  h1,h2,h3,p{margin:0;text-wrap:balance;}
  ul{margin:0;padding:0;list-style:none;}
  input{font-family:inherit;}
  ::selection{background:var(--ink);color:var(--soft-white);}

  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter);}
  .section{padding-block:var(--gap-xl);}
  .section--tight{padding-block:var(--gap-lg);}
  .eyebrow{
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--ink-50);
  }
  .h-editorial{
    font-family:var(--serif);
    font-weight:500;
    line-height:1.02;
    letter-spacing:-0.01em;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:var(--radius);
    background:var(--ink);color:var(--soft-white);
    border:1px solid var(--ink);
    font-size:.82rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    transition:background .25s ease, color .25s ease, border-color .25s ease, transform .2s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--accent, var(--ink));border-color:var(--accent, var(--ink));color:var(--ink);}
  .btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn--ghost:hover{background:var(--ink);color:var(--soft-white);}
  .btn--line{background:transparent;color:var(--soft-white);border:1px solid rgba(251,250,247,.6);}
  .btn--line:hover{background:var(--soft-white);color:var(--ink);border-color:var(--soft-white);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:1px solid transparent;
    display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);
    transition:background .2s ease;
  }
  .icon-btn:hover{background:rgba(37,37,37,.06);}

  /* ---------- Header ---------- */
  .site-header{
    position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;width:100%;z-index:60;
    background:rgba(251,250,247,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    transition:background-color .35s ease,border-color .35s ease,backdrop-filter .35s ease;
  }
  .site-header.is-transparent{
    background:transparent;backdrop-filter:none;border-bottom-color:transparent;
  }
  .site-header.is-transparent .logo,
  .site-header.is-transparent .nav-main button,
  .site-header.is-transparent .nav-main a,
  .site-header.is-transparent .icon-btn{
    color:var(--soft-white);text-shadow:0 1px 10px rgba(0,0,0,.35);
  }
  .site-header.is-transparent .logo svg,
  .site-header.is-transparent .icon-btn svg{
    filter:drop-shadow(0 1px 8px rgba(0,0,0,.35));
  }
  .site-header.is-transparent .nav-main button.is-open::after,
  .site-header.is-transparent .nav-main a:hover::after{
    background:var(--soft-white);box-shadow:0 1px 8px rgba(0,0,0,.35);
  }
  .site-header.is-transparent .icon-btn:hover{background:rgba(251,250,247,.16);}
  .site-header.is-transparent .cart-count{background:var(--soft-white);color:var(--ink);text-shadow:none;box-shadow:0 1px 8px rgba(0,0,0,.3);}
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    height:76px;
  }
  .nav-main{display:flex;align-items:center;gap:30px;}
  .nav-main button, .nav-main a{
    font-size:.82rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    background:none;border:none;color:var(--ink);padding:6px 0;position:relative;
    transition:color .25s ease;
  }
  .nav-main button.is-open::after, .nav-main a:hover::after{
    content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--ink);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.28rem;letter-spacing:.06em;background:none;border:none;padding:0;color:inherit;cursor:pointer;font-family:inherit;transition:color .25s ease;}
  .logo svg{width:26px;height:26px;}
  .header-actions{display:flex;align-items:center;gap:4px;}
  .cart-count{
    position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:50%;
    background:var(--ink);color:var(--soft-white);font-size:.6rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .icon-btn-wrap{position:relative;}

  .megamenu{
    position:absolute;left:0;right:0;top:100%;background:var(--soft-white);
    border-bottom:1px solid var(--line);box-shadow:0 24px 48px -24px rgba(37,37,37,.25);
    animation:dropIn .18s ease;
  }
  @keyframes dropIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .megamenu-inner{display:flex;gap:var(--gap-lg);padding-block:36px;}
  .megamenu-col h4{font-size:.68rem;letter-spacing:.12em;color:var(--ink-50);text-transform:uppercase;margin-bottom:14px;font-weight:700;}
  .megamenu-col ul{display:flex;flex-direction:column;gap:11px;}
  .megamenu-col a{font-size:.95rem;font-weight:500;}
  .megamenu-col a:hover{color:var(--accent);}
  .mm-state-chip{display:flex;align-items:center;gap:9px;}
  .mm-state-col{display:flex;flex-direction:column;gap:9px;min-width:150px;}
  .mm-state-name{
    display:flex;align-items:baseline;gap:8px;
    font-family:var(--sans);font-weight:700;font-size:1.08rem;letter-spacing:-.01em;
    color:color-mix(in srgb, var(--accent) 62%, var(--ink) 38%);
    transition:color .2s ease;
  }
  .mm-state-name:hover{color:var(--ink);}
  .mm-state-num{font-size:.72rem;font-weight:600;letter-spacing:.04em;opacity:.75;}
  .mm-state-mood{font-size:.8rem;color:var(--ink-50);margin:0;}
  .mm-state-btn{
    margin-top:5px;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;
    font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:9px 15px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--ink-70);transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .mm-state-btn:hover{
    border-color:color-mix(in srgb, var(--accent) 55%, var(--ink) 15%);
    color:color-mix(in srgb, var(--accent) 65%, var(--ink) 35%);
    background:color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .mm-dot{width:10px;height:10px;border-radius:50%;flex:none;}

  /* ---------- Hero (full-bleed 4-state switcher) ---------- */
  .hero{position:relative;width:100%;height:min(94vh,920px);min-height:620px;margin-top:calc(var(--header-h) * -1);overflow:hidden;color:var(--soft-white);--accent:#FF5B2E;touch-action:pan-y;}
  .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease;filter:brightness(1.1) saturate(.93) contrast(.96);}
  .hero-slide.is-active{opacity:1;}
  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(37,37,37,.16) 0%, rgba(37,37,37,.04) 30%, rgba(37,37,37,.44) 100%);
  }
  .hero-ring{position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none;opacity:.75;filter:drop-shadow(0 2px 14px rgba(0,0,0,.35));transition:border-color .3s ease;}
  .hero-ring--top{width:300px;height:300px;top:-90px;left:34%;}
  .hero-ring--bottom{width:200px;height:200px;bottom:14%;left:54%;}
  .hero-content{position:relative;height:100%;display:flex;align-items:flex-end;padding-bottom:clamp(10px,1.6vw,22px);z-index:2;}
  .hero-text-block{max-width:540px;}
  .hero-eyebrow{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:rgba(251,250,247,.92);text-shadow:0 1px 10px rgba(0,0,0,.25);}
  .hero-eyebrow-rule{width:26px;height:2px;background:var(--accent);margin:16px 0 22px;box-shadow:0 1px 6px rgba(0,0,0,.3);}
  .hero-text-wrap{transition:opacity .18s ease;}
  .hero-text-wrap.is-fading{opacity:0;}
  .hero-headline{font-family:var(--sans);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.06;color:var(--soft-white);max-width:12ch;text-shadow:0 2px 18px rgba(0,0,0,.3);}
  .hero-state-line{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.3rem,2vw,1.7rem);color:var(--soft-white);margin-top:18px;text-shadow:0 1px 12px rgba(0,0,0,.3);}
  .hero-cta{
    margin-top:26px;display:inline-flex;align-items:center;gap:10px;
    background:transparent;border:1px solid rgba(251,250,247,.65);color:var(--soft-white);
    box-shadow:none;font-weight:600;
    transition:background .3s ease,border-color .3s ease,color .3s ease;
  }
  .hero-cta svg{transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .hero-cta:hover{
    background:color-mix(in srgb, var(--accent) 22%, transparent);
    border-color:var(--accent);color:var(--soft-white);transform:none;
  }
  .hero-cta:hover svg{transform:translateX(3px);}
  .hero-state-row{display:flex;gap:18px;margin-top:38px;flex-wrap:wrap;}
  .hero-state-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px;cursor:pointer;color:rgba(251,250,247,.75);}
  .hero-state-circle{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(251,250,247,.5);background-size:cover;background-position:center;background-color:rgba(251,250,247,.15);box-shadow:0 4px 14px -6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,border-color .2s ease;}
  .hero-state-btn.is-active .hero-state-circle{transform:scale(1.08);border-color:var(--soft-white);box-shadow:0 0 0 2px var(--soft-white),0 0 0 3px var(--accent),0 4px 14px -6px rgba(0,0,0,.35);}
  .hero-state-btn:hover .hero-state-circle{transform:scale(1.04);}
  .hero-state-label{font-size:.62rem;letter-spacing:.09em;font-weight:700;text-transform:uppercase;color:rgba(251,250,247,.68);transition:color .2s ease;}
  .hero-state-btn.is-active .hero-state-label{color:var(--soft-white);}
  .hero-state-tick{width:1px;height:13px;background:rgba(251,250,247,.35);margin-top:1px;transition:background .2s ease,height .2s ease;}
  .hero-state-btn.is-active .hero-state-tick{background:var(--accent);height:16px;}
  .hero-foot-row{margin-top:clamp(36px,5vw,60px);}
  .hero-scroll-cue{display:inline-flex;align-items:center;gap:14px;background:none;border:none;color:rgba(251,250,247,.85);cursor:pointer;}
  .hero-scroll-circle{width:36px;height:36px;border-radius:50%;border:1px solid rgba(251,250,247,.5);display:flex;align-items:center;justify-content:center;flex:none;}
  .hero-scroll-circle svg{transform:rotate(90deg);width:13px;height:13px;}
  .hero-scroll-text{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;}

  .hero-state-index{position:absolute;right:clamp(20px,4vw,56px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:2;}
  .hero-index-rule{width:1px;height:26px;background:rgba(251,250,247,.5);flex:none;}
  .hero-index-item{background:none;border:none;color:rgba(251,250,247,.62);font-size:.66rem;letter-spacing:.12em;font-weight:700;padding:3px 4px;cursor:pointer;transition:color .2s ease;}
  .hero-index-item.is-active{color:var(--soft-white);}
  .hero-discover{position:absolute;right:clamp(20px,4vw,56px);bottom:14px;display:flex;align-items:center;gap:12px;color:var(--soft-white);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:none;border:none;z-index:2;cursor:pointer;}
  .hero-discover-line{width:32px;height:1px;background:rgba(251,250,247,.7);}

  /* ---------- States panels ---------- */
  .states-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--ink);}
  .state-panel{
    position:relative;aspect-ratio:3/4;overflow:hidden;color:var(--soft-white);cursor:pointer;
    background-size:cover;background-position:center;
  }
  .state-panel:focus-visible{outline:2px solid rgba(251,250,247,.8);outline-offset:-2px;}
  .state-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease;}
  .state-panel:hover img{transform:scale(1.06);}
  .state-panel-scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(135deg, color-mix(in srgb, color-mix(in srgb, var(--accent) 55%, var(--ink) 45%) 55%, transparent) 0%, transparent 62%),
      linear-gradient(180deg, rgba(37,37,37,0) 30%, rgba(37,37,37,.78) 100%);
    transition:background .35s ease;
  }
  .state-panel:hover .state-panel-scrim,
  .state-panel.is-open .state-panel-scrim{
    background:
      linear-gradient(135deg, color-mix(in srgb, color-mix(in srgb, var(--accent) 55%, var(--ink) 45%) 55%, transparent) 0%, transparent 62%),
      linear-gradient(180deg, rgba(37,37,37,0) 12%, rgba(37,37,37,.86) 55%, rgba(37,37,37,.92) 100%);
  }
  .state-panel-body{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:space-between;}
  .state-num{font-size:.78rem;font-weight:700;letter-spacing:.08em;}
  .state-name{font-size:clamp(1.6rem,2.6vw,2.3rem);font-weight:800;letter-spacing:.02em;}
  .state-mood{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;opacity:.9;margin-top:7px;}
  .state-line{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,1.9vw,1.85rem);margin-top:10px;}
  .state-panel-story{
    font-family:var(--sans);font-weight:400;font-size:clamp(.92rem,1vw,1.02rem);line-height:1.55;
    color:rgba(251,250,247,.94);max-height:0;opacity:0;overflow:hidden;margin-top:0;
    transition:max-height .45s ease, opacity .35s ease, margin-top .45s ease;
  }
  .state-panel:hover .state-panel-story,
  .state-panel.is-open .state-panel-story,
  .state-panel:focus-within .state-panel-story{
    max-height:180px;opacity:1;margin-top:12px;
  }
  .state-cta{
    margin-top:16px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
    font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:11px 18px;border-radius:8px;border:1px solid rgba(251,250,247,.7);
    background:rgba(37,37,37,.15);color:var(--soft-white);backdrop-filter:blur(4px);transition:background .2s ease, color .2s ease;
  }
  .state-panel:hover .state-cta{background:var(--accent);color:var(--soft-white);border-color:var(--accent);}

  /* ---------- Products ---------- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:44px;flex-wrap:wrap;}
  .section-head h2{font-size:clamp(1.7rem,2.6vw,2.5rem);font-weight:800;letter-spacing:-.01em;}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
  .product-card{
    background:var(--soft-white);border-radius:var(--radius);position:relative;
    display:flex;flex-direction:column;
  }
  .product-media{
    position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;
    background:
      radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--vanilla);
    display:flex;align-items:center;justify-content:center;
  }
  .product-media svg{width:34%;height:34%;color:var(--ink-30);}
  .product-media--block{
    background:
      linear-gradient(180deg, transparent 0 56%, color-mix(in srgb, var(--accent) 30%, var(--vanilla)) 56% 100%),
      radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      var(--vanilla);
  }
  .product-media--stripe{
    background:
      repeating-linear-gradient(128deg, color-mix(in srgb, var(--accent) 26%, var(--vanilla)) 0 12px, var(--vanilla) 12px 26px),
      var(--vanilla);
  }
  .product-media-visual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .product-media-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .product-info{cursor:pointer;}
  .badge-state{
    position:absolute;top:14px;left:14px;z-index:2;display:inline-flex;align-items:center;gap:6px;
    font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--soft-white);padding:6px 10px;border-radius:20px;
  }
  .badge-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .wish-btn{
    position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;
    background:rgba(251,250,247,.9);border:none;display:flex;align-items:center;justify-content:center;
    color:var(--ink);transition:transform .15s ease;
  }
  .wish-btn:hover{transform:scale(1.08);}
  .wish-btn.is-active svg{fill:var(--ink);}
  .quickadd-trigger{
    position:absolute;left:14px;right:14px;bottom:14px;
    opacity:0;transform:translateY(6px);transition:opacity .2s ease, transform .2s ease;
  }
  .product-card:hover .quickadd-trigger, .product-card:focus-within .quickadd-trigger{opacity:1;transform:translateY(0);}
  .quickadd-trigger button{width:100%;justify-content:center;}
  .product-info{padding:16px 4px 20px;display:flex;flex-direction:column;gap:5px;}
  .product-name-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .product-name{font-size:.98rem;font-weight:600;}
  .product-price{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .product-cat{font-size:.75rem;color:var(--ink-50);}
  .swatch-row{display:flex;gap:8px;margin-top:4px;}
  .swatch{width:16px;height:16px;border-radius:50%;border:1px solid rgba(37,37,37,.15);padding:0;transition:transform .15s ease;}
  button.swatch{cursor:pointer;}
  button.swatch:hover{transform:scale(1.18);}
  .swatch.is-current{box-shadow:0 0 0 2px var(--soft-white),0 0 0 3px rgba(37,37,37,.55);}

  .quickadd-panel{
    position:absolute;inset:14px 14px auto 14px;top:auto;bottom:60px;
    background:var(--soft-white);border-radius:8px;padding:16px;
    box-shadow:0 16px 40px -12px rgba(37,37,37,.35);z-index:5;
  }
  .qa-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .qa-label{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-50);font-weight:700;margin-bottom:8px;display:block;}
  .size-chip{
    min-width:38px;padding:6px 8px;text-align:center;border-radius:6px;border:1px solid var(--line);
    font-size:.75rem;font-weight:600;background:var(--soft-white);
  }
  .size-chip.is-selected{background:var(--ink);color:var(--soft-white);border-color:var(--ink);}
  .swatch-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;}
  .swatch-btn.is-selected{border-color:var(--ink);}

  /* ---------- Brand line ---------- */
  .brand-line{padding-top:clamp(90px,14vw,180px);padding-bottom:clamp(60px,8vw,110px);}
  .brand-line-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:clamp(40px,6vw,120px);
    align-items:start;
  }
  .brand-line-col--copy{padding-top:clamp(6px,1vw,14px);}
  .brand-line-eyebrow{
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--ink-50);margin-bottom:clamp(20px,3vw,32px);
  }

};
function icon(name, size){
  size = size || 20;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+(ICON_PATHS[name]||'')+'</svg>';
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function colorSwatchesHtml(colors, selectedIdx, pid, act){

}
function sizeChipsHtml(sizes, selectedSize, pid, act){

  var sel = state.quickAddSel[product.id];
  if (!sel){ sel = { size: product.sizes[0], color: 0 }; state.quickAddSel[product.id] = sel; }
  return sel;
}
function quickAddPanelHtml(product){
  var sel = quickAddSelFor(product);
  var st = STATE_BY_ID[product.state];
  return '' +
    '<div class="quickadd-panel" style="--accent:'+st.hex+'">' +
      '<span class="qa-label">Color</span>' +
      '<div class="qa-row">'+colorSwatchesHtml(swatchesFor(product.state), sel.color, product.id)+'</div>' +
      '<span class="qa-label">Size</span>' +
      '<div class="qa-row">'+sizeChipsHtml(product.sizes, sel.size, product.id)+'</div>' +

    '</div>';

function productCardHtml(product){
  var st = STATE_BY_ID[product.state];
  var isWished = state.wishlist.indexOf(product.id) !== -1;
  var qaOpen = state.openQuickAddId === product.id;
  var mediaClass = 'product-media' + (product.variant && product.variant !== 'mono' ? (' product-media--'+product.variant) : '');
  var visualInner = product.img
    ? '<img class="product-media-photo" src="'+product.img+'" alt="'+esc(product.name)+'">'
    : icon(product.icon, 64);
  return '' +
  '<div class="product-card" style="--accent:'+st.hex+'">' +
    '<div class="'+mediaClass+'">' +
      badgeStateHtml(product.state) +
      wishBtnHtml(product.id, isWished) +
      '<div class="product-media-visual" data-act="viewProduct" data-pid="'+product.id+'">'+visualInner+'</div>' +
      (qaOpen ? quickAddPanelHtml(product) : '') +
      '<div class="quickadd-trigger">' +
        '<button class="btn" data-act="toggleQuickAdd" data-pid="'+product.id+'">'+(qaOpen?'Close':'Quick Add')+'</button>' +
      '</div>' +
    '</div>' +
    '<div class="product-info" data-act="viewProduct" data-pid="'+product.id+'">' +
      '<div class="product-name-row"><span class="product-name">'+esc(product.name)+'</span><span class="product-price">€'+product.price+'</span></div>' +
      '<span class="product-cat">'+esc(product.category)+' · '+product.sizes.length+' sizes</span>' +
      '<div class="swatch-row" data-act="none">'+STATES.map(function(s){
        var target = productInState(product, s.id);
        var isCurrent = s.id === product.state;
        if (!target) return '<span class="swatch" style="background:'+s.hex+';opacity:.3" aria-hidden="true"></span>';
        return '<button type="button" class="swatch'+(isCurrent?' is-current':'')+'" style="background:'+s.hex+'" data-act="viewProduct" data-pid="'+target.id+'" aria-label="View in '+esc(s.name)+'"'+(isCurrent?' aria-current="true"':'')+'></button>';
      }).join('')+'</div>' +
    '</div>' +
  '</div>';
}

function breadcrumbHtml(items){
  var parts = items.map(function(it, i){
    var sep = i>0 ? '<span class="sep">/</span>' : '';
    if (it.current) return sep + '<span class="current">'+esc(it.label)+'</span>';
    var attrs = it.home ? 'data-act="goHome"' : ('data-act="viewCategory" data-cat="'+esc(it.cat)+'"');
    return sep + '<button type="button" class="crumb" '+attrs+'>'+esc(it.label)+'</button>';
  }).join('');
  return '<div class="breadcrumb">'+parts+'</div>';
}

function categoryPageHtml(){
  var label = state.currentCategory || "All Products";

  var bannerImg = bannerProduct ? STATE_BY_ID[bannerProduct.state].img : STATES[2].img;

  var sortOptions = [
    ["featured","Featured"],["new","New In"],["bestseller","Bestseller"],
    ["priceAsc","Price: Low to High"],["priceDesc","Price: High to Low"]
  ];

    sortOptions.map(function(o){ return '<option value="'+o[0]+'"'+(state.catSort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('') +
    '</select>';

  var activeCount = activeCatFilterCount();
  var activeChips = [];
  state.catFilters.states.forEach(function(sid){ activeChips.push({label: STATE_BY_ID[sid].name, act:'toggleCatFilterState', val:sid}); });

  state.catFilters.sizes.forEach(function(sz){ activeChips.push({label: 'Size '+sz, act:'toggleCatFilterSize', val:sz}); });

    if (band) activeChips.push({label: band.label, act:'setCatPriceFilter', val:band.id});
  }
  var activeRow = activeChips.length ? (
    '<div class="active-filter-row">' + activeChips.map(function(c){
      return '<span class="active-chip">'+esc(c.label)+'<button data-act="'+c.act+'" data-val="'+esc(c.val)+'">'+icon('close',11)+'</button></span>';
    }).join('') + '<button class="active-chip" style="background:none;text-decoration:underline;" data-act="clearCatFilters">Clear all</button>' +
    '</div>'
  ) : '';

  breadcrumbHtml([{label:'Home', home:true}, {label: label, current:true}]) +
  '<section class="section section--tight"><div class="wrap">' +
    '<div class="category-intro">' +
      '<img src="'+bannerImg+'" alt="'+esc(label)+'">' +
      '<div class="ci-scrim"></div>' +
      '<div class="ci-body"><div class="ci-eyebrow">Shop</div><h1>'+(def.headline||label)+'</h1></div>' +

        '<button class="toolbar-btn" data-act="toggleFilterDrawer">Filter'+(activeCount?('<span class="count-dot">'+activeCount+'</span>'):'')+'</button>' +
        '<span class="toolbar-count">'+sorted.length+' piece'+(sorted.length===1?'':'s')+'</span>' +
      '</div>' +
      sortSelect +
    '</div>' +
    activeRow +
    grid +
  '</div></section>' +
  (state.filterDrawerOpen ? filterDrawerHtml() : '');

  }).join('');

    var sel = f.materials.indexOf(m) !== -1;
    return '<button type="button" class="filter-chip'+(sel?' is-selected':'')+'" data-act="toggleCatFilterMaterial" data-val="'+esc(m)+'">'+esc(m)+'</button>';

  '<aside class="drawer">' +
    '<div class="drawer-head"><h3>Filter</h3><button class="icon-btn" aria-label="Close filters" data-act="closeFilterDrawer">'+icon('close',20)+'</button></div>' +
    '<div class="drawer-body">' +
      '<div class="filter-group"><h4>State</h4><div class="filter-chip-row">'+stateChips+'</div></div>' +
      '<div class="filter-group"><h4>Size</h4><div class="filter-chip-row">'+sizeChips+'</div></div>' +
      '<div class="filter-group"><h4>Material</h4><div class="filter-chip-row">'+matChips+'</div></div>' +
      '<div class="filter-group"><h4>Price</h4><div class="filter-chip-row">'+priceChips+'</div></div>' +
      '<div class="filter-group"><h4>Availability</h4><div class="filter-chip-row"><span class="filter-chip is-selected" style="cursor:default">In Stock</span></div></div>' +
    '</div>' +
    '<div class="filter-drawer-foot">' +
      '<button class="btn btn--ghost" data-act="clearCatFilters">Clear all</button>' +
      '<button class="btn" data-act="closeFilterDrawer">Show results</button>' +

  '</aside>';
}

  if (!sel){ sel = { size: product.sizes[0], color: 0 }; state.pdpSel[product.id] = sel; }
  return sel;
}

  return shotId === 'lifestyle' ? STATE_BY_ID[product.state].img : null;

  '<div class="pdp-sticky-bar" id="pdpStickyBar"><span class="psb-price">€'+product.price+'</span><button class="btn" data-act="addToCartPdp" data-pid="'+product.id+'">Add to Bag</button></div>';
}

/* ================= RENDER: OUR STORY ================= */

function storyPageHtml(){
  var statesBand = STATES.map(function(s){
    return '' +
    '<div class="story-state-cell">' +
      '<span class="dot" style="background:'+s.hex+'"></span>' +
      '<span class="name">'+s.num+' '+esc(s.name)+'</span>' +
      '<span class="line">'+esc(s.line)+'</span>' +
    '</div>';
  }).join('');

  var pillars = [
    ['01','Langsamkeit als Haltung','Wir glauben, dass die schönsten Momente die sind, für die man sich Zeit nimmt. Kein Trend, keine Eile — nur der bewusste Wechsel vom Tun ins Sein.'],
    ['02','Material mit Bedeutung','Jedes Piece ist so gemacht, dass es sich auf der Haut richtig anfühlt: weiche Frottee-Qualitäten, klare Silhouetten, Farben, die eine Stimmung tragen statt nur zu dekorieren.'],
    ['03','Design, das sich gut anfühlt','Form folgt Gefühl. Wir gestalten nicht für den Laufsteg, sondern für den Moment danach — barfuß, warm, angekommen.']
  ].map(function(p){
    return '<div class="story-pillar"><div class="story-pillar-num">'+p[0]+'</div><h3>'+esc(p[1])+'</h3><p>'+esc(p[2])+'</p></div>';
  }).join('');

  return '' +
  breadcrumbHtml([{label:'Home', home:true},{label:'Our Story', current:true}]) +
  '<section class="story-hero" style="background-image:url(images/hero-sea.jpg)">' +
    '<div class="story-hero-scrim"></div>' +
    '<div class="wrap story-hero-content">' +
      '<p class="story-hero-eyebrow">Our Story</p>' +
      '<h1 class="story-hero-headline">Es beginnt mit<br>einem Atemzug.</h1>' +
      '<p class="story-hero-sub">Dem ersten nach dem Sprung ins Wasser. Dem letzten vor dem Einschlafen. VAINEA ist die Geschichte dieser kleinen, stillen Übergänge — und der Wunsch, sie sichtbar zu machen.</p>' +
    '</div>' +
  '</section>' +
  '<section class="section"><div class="wrap story-manifesto">' +
    '<span class="eyebrow">Warum wir das tun</span>' +
    '<p class="story-manifesto-text">VAINEA ist nicht am Reißbrett entstanden. Es ist an einem Nachmittag entstanden, an dem jemand nach dem Schwimmen im nassen Handtuch auf einer warmen Mauer saß und dachte: <em>„Genau dieses Gefühl — das will ich nicht vergessen.“</em></p>' +
  '</div></section>' +
  '<section class="section section--tight bg-vanilla"><div class="wrap">' +
    '<div class="section-head"><div><div class="eyebrow">Vier Stimmungen, eine Haltung</div><h2>UNSERE STATES.</h2></div></div>' +
    '<div class="story-states-band">'+statesBand+'</div>' +
  '</div></section>' +
  '<section class="section"><div class="wrap">' +
    '<div class="section-head"><div><div class="eyebrow">Was uns leitet</div><h2>DREI DINGE, DIE UNS WICHTIG SIND.</h2></div></div>' +
    '<div class="story-pillars">'+pillars+'</div>' +
  '</div></section>' +
  '<section class="section section--tight"><div class="wrap">' +
    '<div class="pdp-story">' +
      '<img src="images/hero-dream.jpg" alt="Ein ruhiger Moment am Wasser">' +
      '<div>' +
        '<p class="pdp-story-eyebrow">Ein persönliches Wort</p>' +
        '<h3>„Ich wollte etwas schaffen, das sich anfühlt wie der Moment, in dem man endlich durchatmet.“</h3>' +
        '<p>VAINEA hat für mich mit einem einzigen Sommer begonnen — mit salzigem Haar, warmer Haut und der Erkenntnis, dass Ruhe kein Luxus sein sollte, sondern ein Zustand, den man jederzeit anziehen kann. Jedes Piece, das wir machen, ist ein kleines Stück dieses Sommers.</p>' +
        '<p class="story-founder-sign">— Mira Voss, Gründerin von VAINEA</p>' +
      '</div>' +
    '</div>' +
  '</div></section>' +
  '<section class="story-cta"><div class="wrap">' +
    '<h2 class="h-editorial">Finde deinen State.</h2>' +
    '<p>Vier Stimmungen. Eine Haltung. Welche ist heute deine?</p>' +
    '<button class="btn" data-act="goHome">Zu den States '+icon('arrowRight',14)+'</button>' +
  '</div></section>';
}

/* ================= APP ================= */

function appHtml(){
  var pageHtml;
  if (state.view === 'category'){
    pageHtml = categoryPageHtml();
  } else if (state.view === 'pdp'){
    pageHtml = pdpHtml();
  } else if (state.view === 'state'){
    pageHtml = statePageHtml();
  } else if (state.view === 'story'){
    pageHtml = storyPageHtml();
  } else {
    pageHtml = '' +
      heroHtml() +
      statesGridHtml() +
      brandLineHtml() +
      featuredProductsHtml() +
      detailStoryHtml() +
      shopTheLookHtml() +
      accessoriesHtml() +
      findYourStateHtml() +
      instagramTeaserHtml() +
      newsletterHtml();
  }
  return '' +
    headerHtml() +
    pageHtml +
    footerHtml() +
    mobileNavHtml() +
    (state.cartOpen ? cartDrawerHtml() : '') +
    (state.wishOpen ? wishlistDrawerHtml() : '') +
    (state.searchOpen ? searchOverlayHtml() : '') +
    toastHtml();
}

var root = null;
function render(){
  if (!root) root = document.getElementById('root');
  root.innerHTML = appHtml();
  document.body.classList.toggle('has-pdp', state.view === 'pdp');
  if (state.searchOpen){
    var input = document.getElementById('searchInput');
    if (input){ input.focus(); var v = input.value; input.value=''; input.value=v; }
  }
  updateHeaderTransparency();
}

function updateHeaderTransparency(){
  var header = document.getElementById('siteHeader');
  if (!header) return;
  if (state.openMenu){ header.classList.remove('is-transparent'); return; }
  var heroEl = state.view === 'home' ? document.getElementById('heroSection') : null;
  if (!heroEl){ header.classList.remove('is-transparent'); return; }
  var headerH = header.offsetHeight || 76;
  var rect = heroEl.getBoundingClientRect();
  if (rect.bottom > headerH){
    header.classList.add('is-transparent');
  } else {
    header.classList.remove('is-transparent');
  }
}

function goTo(view, extra){
  state.view = view;
  state.openMenu = null;
  if (extra) Object.keys(extra).forEach(function(k){ state[k] = extra[k]; });
  render();
  window.scrollTo({ top:0, behavior:'auto' });
}

/* ================= ACTIONS ================= */

var toastTimer = null;
function showToast(msg){
  state.toast = msg;
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', toastHtml());
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    state.toast = '';
    var t = document.querySelector('.toast');
    if (t) t.remove();
  }, 2600);
}

function addToCart(product, size, colorIdx){
  var lineId = product.id+'__'+size+'__'+colorIdx;
  var existing = state.lines.find(function(l){ return l.lineId===lineId; });
  if (existing){ existing.qty += 1; }
  else {
    state.lines.push({
      lineId: lineId, productId: product.id, name: product.name, state: product.state,
      icon: product.icon, price: product.price, size: size, colorIdx: colorIdx, qty: 1
    });
  }
  state.cartOpen = true;
  render();
  showToast(product.name + ' added to your bag.');
}

function scrollToProducts(){
  setTimeout(function(){
    var el = document.getElementById('products');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 30);
}

function resetCatFilters(){
  state.catFilters = { states: [], materials: [], sizes: [], price: null };
  state.catSort = 'featured';
}

function toggleStateStory(id){
  var panel = document.querySelector('.state-panel[data-state="'+id+'"]');
  if (panel) panel.classList.toggle('is-open');
}

function updateHeroVisual(idx){
  var n = STATES.length;
  idx = ((idx % n) + n) % n;
  if (idx === state.heroActive) return;
  state.heroActive = idx;
  var s = STATES[idx];

  document.querySelectorAll('.hero-slide').forEach(function(node,i){ node.classList.toggle('is-active', i===idx); });
  document.querySelectorAll('.hero-state-btn').forEach(function(node,i){ node.classList.toggle('is-active', i===idx); node.setAttribute('aria-pressed', i===idx); });
  document.querySelectorAll('.hero-index-item').forEach(function(node,i){ node.classList.toggle('is-active', i===idx); });

  var heroSection = document.getElementById('heroSection');
  if (heroSection) heroSection.style.setProperty('--accent', s.hex);

  var textWrap = document.getElementById('heroTextWrap');
  if (!textWrap) return;
  textWrap.classList.add('is-fading');
  setTimeout(function(){
    var eyebrowEl = document.getElementById('heroEyebrow');
    var lineEl = document.getElementById('heroStateLine');
    var ctaEl = document.getElementById('heroCta');
    var ctaLabelEl = document.getElementById('heroCtaLabel');
    if (eyebrowEl) eyebrowEl.textContent = s.mood;
    if (lineEl) lineEl.textContent = s.line;
    if (ctaLabelEl) ctaLabelEl.textContent = 'Shop ' + s.num + ' ' + s.name;
    if (ctaEl) ctaEl.dataset.state = s.id;
    textWrap.classList.remove('is-fading');
  }, 160);
}

function init(){
  render();

  window.addEventListener('scroll', updateHeaderTransparency, { passive:true });
  window.addEventListener('resize', updateHeaderTransparency);

  var heroTouchStartX = null;
  document.addEventListener('touchstart', function(e){
    var heroEl = e.target.closest('.hero');
    heroTouchStartX = heroEl ? e.changedTouches[0].clientX : null;
  }, { passive:true });
  document.addEventListener('touchend', function(e){
    if (heroTouchStartX == null) return;
    var dx = e.changedTouches[0].clientX - heroTouchStartX;
    heroTouchStartX = null;
    if (Math.abs(dx) < 40) return;
    updateHeroVisual(state.heroActive + (dx < 0 ? 1 : -1));
  }, { passive:true });

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el){
      if (state.openMenu && !e.target.closest('.site-header')){ state.openMenu = null; render(); }
      return;
    }
    if (el.tagName === 'A') e.preventDefault();
    var act = el.dataset.act;
    var pid = el.dataset.pid;
    var product = pid ? PRODUCT_BY_ID[pid] : null;

    if (act === 'goHome'){
      goTo('home');
    } else if (act === 'viewStory'){
      goTo('story');
    } else if (act === 'viewCategory'){
      state.currentCategory = el.dataset.cat;
      resetCatFilters();
      if (el.dataset.sort) state.catSort = el.dataset.sort;
      goTo('category');
    } else if (act === 'viewProduct'){
      state.currentProductId = pid;
      state.pdpGalleryIdx = 0;
      state.openAccordion = 'Details';
      goTo('pdp');
    } else if (act === 'toggleFilterDrawer'){
      state.filterDrawerOpen = !state.filterDrawerOpen; render();
    } else if (act === 'closeFilterDrawer'){
      state.filterDrawerOpen = false; render();
    } else if (act === 'toggleCatFilterState'){
      var vS = el.dataset.val, iS = state.catFilters.states.indexOf(vS);
      if (iS===-1) state.catFilters.states.push(vS); else state.catFilters.states.splice(iS,1);
      render();
    } else if (act === 'toggleCatFilterMaterial'){
      var vM = el.dataset.val, iM = state.catFilters.materials.indexOf(vM);
      if (iM===-1) state.catFilters.materials.push(vM); else state.catFilters.materials.splice(iM,1);
      render();
    } else if (act === 'toggleCatFilterSize'){
      var vZ = el.dataset.val, iZ = state.catFilters.sizes.indexOf(vZ);
      if (iZ===-1) state.catFilters.sizes.push(vZ); else state.catFilters.sizes.splice(iZ,1);
      render();
    } else if (act === 'setCatPriceFilter'){
      var vP = el.dataset.val;
      state.catFilters.price = (state.catFilters.price === vP) ? null : vP;
      render();
    } else if (act === 'clearCatFilters'){
      resetCatFilters(); render();
    } else if (act === 'pdpGalleryIdx'){
      state.pdpGalleryIdx = parseInt(el.dataset.idx, 10); render();
    } else if (act === 'pdpColor'){
      pdpSelFor(product).color = parseInt(el.dataset.idx, 10); render();
    } else if (act === 'pdpSize'){
      pdpSelFor(product).size = el.dataset.size; render();
    } else if (act === 'addToCartPdp'){
      var pSel = pdpSelFor(product);
      addToCart(product, pSel.size, pSel.color);
    } else if (act === 'toggleAccordion'){
      var key = el.dataset.key;
      state.openAccordion = (state.openAccordion === key) ? null : key;
      render();
    } else if (act === 'sizeGuide'){
      showToast('Size guide coming soon.');
    } else if (act === 'toggleMenu'){
      var m = el.dataset.menu;
      state.openMenu = (state.openMenu === m) ? null : m;
      render();
    } else if (act === 'navClose'){
      state.openMenu = null; render();
    } else if (act === 'openSearch'){
      state.searchOpen = true; render();
    } else if (act === 'closeSearch'){
      state.searchOpen = false; render();
    } else if (act === 'openCart'){
      state.cartOpen = true; render();
    } else if (act === 'closeCart'){
      state.cartOpen = false; render();
    } else if (act === 'openWish'){
      state.wishOpen = true; render();
    } else if (act === 'closeWish'){
      state.wishOpen = false; render();
    } else if (act === 'toggleWish'){
      var idx = state.wishlist.indexOf(pid);
      if (idx===-1) state.wishlist.push(pid); else state.wishlist.splice(idx,1);
      render();
    } else if (act === 'toggleQuickAdd'){
      state.openQuickAddId = (state.openQuickAddId === pid) ? null : pid;
      render();
    } else if (act === 'qaColor'){
      quickAddSelFor(product).color = parseInt(el.dataset.idx, 10);
      render();
    } else if (act === 'qaSize'){
      quickAddSelFor(product).size = el.dataset.size;
      render();
    } else if (act === 'addToCart'){
      var sel = quickAddSelFor(product);
      state.openQuickAddId = null;
      addToCart(product, sel.size, sel.color);
    } else if (act === 'hotspotAdd'){
      state.openHotspotId = null;
      addToCart(product, product.sizes[0], 0);
    } else if (act === 'wishAdd'){
      addToCart(product, product.sizes[0], 0);
    } else if (act === 'qty'){
      var delta = parseInt(el.dataset.delta, 10);
      var line = state.lines.find(function(l){ return l.lineId===el.dataset.line; });
      if (line) line.qty = Math.max(1, line.qty + delta);
      render();
    } else if (act === 'removeLine'){
      state.lines = state.lines.filter(function(l){ return l.lineId !== el.dataset.line; });
      render();
    } else if (act === 'selectState'){
      goTo('state', { currentStateId: el.dataset.state });
    } else if (act === 'clearFilter'){
      state.filterState = null; render();
    } else if (act === 'checkout'){
      showToast('Demo checkout — connect a payment provider to go live.');
    } else if (act === 'toggleHotspot'){
      state.openHotspotId = (state.openHotspotId === pid) ? null : pid;
      render();
    } else if (act === 'setMood'){
      state.quizResult = el.dataset.state; render();
    } else if (act === 'heroSelect'){
      updateHeroVisual(parseInt(el.dataset.idx, 10));
    } else if (act === 'toggleStateStory'){
      toggleStateStory(el.dataset.state);
    } else if (act === 'scrollStates'){
      var statesEl = document.getElementById('states');
      if (statesEl) statesEl.scrollIntoView({ behavior:'smooth', block:'start' });
    } else if (act === 'scrollProducts'){
      scrollToProducts();
    } else if (act === 'scrollStateArticles'){
      var artEl = document.getElementById('stateArticles');
      if (artEl) artEl.scrollIntoView({ behavior:'smooth', block:'start' });
    } else if (act === 'scrollTop'){
      if (state.view !== 'home'){ goTo('home'); }
      else { window.scrollTo({ top:0, behavior:'smooth' }); }
    }
  });

  document.addEventListener('input', function(e){
    if (e.target.id === 'searchInput'){
      state.searchQuery = e.target.value;
      var region = document.getElementById('searchResultsRegion');
      if (region) region.innerHTML = searchResultsHtml();
    } else if (e.target.id === 'newsletterEmail'){
      state.newsletterEmail = e.target.value;
    }
  });

  document.addEventListener('change', function(e){
    if (e.target.id === 'catSortSelect'){
      state.catSort = e.target.value;
      render();
    }
  });

  document.addEventListener('submit', function(e){
    if (e.target.id === 'newsletterForm'){
      e.preventDefault();
      if (state.newsletterEmail && state.newsletterEmail.trim()){
        state.newsletterDone = true;
        render();
      }
    }
  });
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

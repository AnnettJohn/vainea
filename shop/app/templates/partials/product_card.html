<a class="product-card" href="/products/{{ p.slug }}" style="--accent: {{ p.state.hex_color }}">
  {% if p.images %}
  <img src="{{ p.images[0].url }}" alt="{{ p.images[0].alt_text or p.name }}" loading="lazy">
  {% endif %}
  <div class="product-card-body">
    {% if p.is_new %}<span class="badge">Neu</span>{% endif %}
    {% if p.is_bestseller %}<span class="badge">Bestseller</span>{% endif %}
    <h3>{{ p.name }}</h3>
    <p>€{{ "%.2f"|format(p.price) }}</p>
  </div>
</a>

{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="wrap narrow-form">
    <h1 class="h-editorial">Login</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post" action="/account/login" class="address-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label>E-Mail
        <input type="email" name="email" required autofocus>
      </label>
      <label>Passwort
        <input type="password" name="password" required>
      </label>
      <button class="btn" type="submit">Einloggen</button>
    </form>
    <p class="form-hint">Noch kein Konto? <a href="/account/register">Jetzt registrieren</a></p>
  </div>
</section>
{% endblock %}
